[package]
name = "via"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Rehno Lindeque"]
description = "Issue commands across multiple interactive CLI sessions"

[dependencies]
anyhow = "1.0"
# "termination" so the cleanup handler also runs on SIGTERM/SIGHUP, not just Ctrl-C
ctrlc = { version = "3.4", features = ["termination"] }
libc = "0.2"
strip-ansi-escapes = "0.2"

[[bin]]
name = "via"
path = "src/main.rs"
